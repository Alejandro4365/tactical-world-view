<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical World View</title>

  <!-- three.js core + TrackballControls (pinned r128 UMD build, mutually compatible) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

  <!-- GSAP for the flat<->sphere morph tween -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #020611;
      color: #fff;
    }

    #view-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #view-container canvas {
      display: block;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(8, 14, 28, 0.85);
      padding: 16px 22px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.15);
    }

    h2 {
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00e1ff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-toggle:hover {
      box-shadow: 0 0 12px rgba(0, 225, 255, 0.8);
      transform: translateY(-1px);
    }

    .btn-toggle:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h2>Tactical Command</h2>
    <p style="font-size: 12px; margin-bottom: 10px; color: #8a9bb8;">Mode: <span id="mode-text" style="color: #fff;">Planet (3D)</span></p>
    <button class="btn-toggle" id="toggle-btn" onclick="toggleView()">Switch to Mapamundi</button>
  </div>

  <div id="view-container"></div>

  <script>
    // ---------------------------------------------------------------
    // Mesh configuration
    // ---------------------------------------------------------------
    // High-resolution lat/lon grid shared by BOTH the flat map and the
    // globe. Every vertex is computed twice, mathematically:
    //   - once as a point on the flat map plane (Equal Earth projection)
    //   - once as a point on a sphere, via standard spherical->cartesian
    //     conversion (the same formula THREE.SphereGeometry itself uses)
    // Toggling just interpolates each vertex between its two positions.
    const LON_SEGMENTS = 256; // columns (very high resolution mesh)
    const LAT_SEGMENTS = 128; // rows
    const SPHERE_RADIUS = 100;
    const FLAT_WIDTH = 340;   // world units for the flat map's bounding box
    const FLAT_HEIGHT = 170;

    // Popular, widely-used high-resolution equirectangular Earth texture
    // (NASA "Blue Marble" imagery, as redistributed by the three-globe project).
    const EARTH_TEXTURE_URL = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';

    // --- Equal Earth projection (Savric, Patterson & Jenny, 2018) ---
    // Replaces the previous plain equirectangular flat map with an
    // equal-area pseudocylindrical projection. Longitude/latitude in
    // degrees in, projected {x, y} out (unscaled units).
    const EE_A1 = 1.340264, EE_A2 = -0.081106, EE_A3 = 0.000893, EE_A4 = 0.003796;
    function equalEarthProject(lonDeg, latDeg) {
      const lambda = lonDeg * Math.PI / 180;
      const phi = latDeg * Math.PI / 180;
      const theta = Math.asin((Math.sqrt(3) / 2) * Math.sin(phi));
      const t2 = theta * theta;
      const t3 = t2 * theta;
      const t6 = t3 * t3;
      const t7 = t6 * theta;
      const t8 = t7 * theta;
      const t9 = t8 * theta;
      const x = (2 * Math.sqrt(3) * lambda * Math.cos(theta)) /
                (3 * (9 * EE_A4 * t8 + 7 * EE_A3 * t6 + 3 * EE_A2 * t2 + EE_A1));
      const y = EE_A4 * t9 + EE_A3 * t7 + EE_A2 * t3 + EE_A1 * theta;
      return { x, y };
    }
    // Normalization so the projected map fits exactly inside FLAT_WIDTH x FLAT_HEIGHT.
    const EE_X_MAX = equalEarthProject(180, 0).x;
    const EE_Y_MAX = equalEarthProject(0, 90).y;

    let scene, camera, renderer, controls, mesh;
    let flatPositions, spherePositions; // Float32Array position buffers
    let isGlobe = true;
    let isAnimating = false;
    let autoRotateEnabled = true; // slow idle spin of the globe mesh itself
    const AUTO_ROTATE_SPEED = 0.0012; // radians per frame
    const morphState = { t: 0 }; // 0 = fully flat map, 1 = fully sphere

    function buildGrid() {
      const geometry = new THREE.BufferGeometry();

      const vertsPerRow = LON_SEGMENTS + 1;
      const vertsPerCol = LAT_SEGMENTS + 1;
      const vertexCount = vertsPerRow * vertsPerCol;

      flatPositions = new Float32Array(vertexCount * 3);
      spherePositions = new Float32Array(vertexCount * 3);
      const uvs = new Float32Array(vertexCount * 2);

      let vi = 0;
      for (let row = 0; row <= LAT_SEGMENTS; row++) {
        // v: 0 at north pole (top of texture), 1 at south pole (bottom)
        const v = row / LAT_SEGMENTS;
        const lat = 90 - v * 180;              // degrees, +90 -> -90
        const phi = v * Math.PI;               // polar angle, 0 -> PI

        for (let col = 0; col <= LON_SEGMENTS; col++) {
          // u: 0 at west edge (-180), 1 at east edge (+180)
          const u = col / LON_SEGMENTS;
          const lon = u * 360 - 180;           // degrees, -180 -> +180
          const theta = u * Math.PI * 2;       // azimuth, 0 -> 2PI

          // --- Flat map plane, Equal Earth projection of lon/lat ---
          const proj = equalEarthProject(lon, lat);
          const fx = (proj.x / EE_X_MAX) * (FLAT_WIDTH / 2);
          const fy = (proj.y / EE_Y_MAX) * (FLAT_HEIGHT / 2);
          const fz = 0;

          // --- Sphere, via spherical -> cartesian conversion ---
          // Matches THREE's own UV-sphere convention so the texture
          // lines up identically in both flat and sphere form.
          const sx = -SPHERE_RADIUS * Math.sin(phi) * Math.cos(theta);
          const sy = SPHERE_RADIUS * Math.cos(phi);
          const sz = SPHERE_RADIUS * Math.sin(phi) * Math.sin(theta);

          flatPositions[vi * 3 + 0] = fx;
          flatPositions[vi * 3 + 1] = fy;
          flatPositions[vi * 3 + 2] = fz;

          spherePositions[vi * 3 + 0] = sx;
          spherePositions[vi * 3 + 1] = sy;
          spherePositions[vi * 3 + 2] = sz;

          // Texture v is flipped here: three.js uploads images with
          // flipY=true by default, so v=1 (not v=0) corresponds to the
          // top/north row of a normally-loaded image. Without this flip
          // the whole map/globe renders north-south inverted.
          uvs[vi * 2 + 0] = u;
          uvs[vi * 2 + 1] = 1 - v;

          vi++;
        }
      }

      const startPositions = new Float32Array(spherePositions);

      const indices = [];
      for (let row = 0; row < LAT_SEGMENTS; row++) {
        for (let col = 0; col < LON_SEGMENTS; col++) {
          const a = row * vertsPerRow + col;
          const b = a + 1;
          const c = a + vertsPerRow;
          const d = c + 1;
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      geometry.setIndex(indices);
      geometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.computeVertexNormals();

      return geometry;
    }

    // Camera distance (looking straight down -z at the origin) needed so
    // the flat map's full FLAT_WIDTH x FLAT_HEIGHT bounding box fits
    // entirely within the current viewport - i.e. the "unfolded" map
    // fills the screen instead of sitting small in the middle.
    function getFlatFitDistance() {
      const container = document.getElementById('view-container');
      const aspect = container.clientWidth / container.clientHeight;
      const vFov = camera.fov * Math.PI / 180;
      const distForHeight = (FLAT_HEIGHT / 2) / Math.tan(vFov / 2);
      const distForWidth = (FLAT_WIDTH / 2) / (Math.tan(vFov / 2) * aspect);
      return Math.max(distForHeight, distForWidth) * 1.02; // tiny margin so edges aren't clipped
    }

    function init() {
      const container = document.getElementById('view-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020611);

      camera = new THREE.PerspectiveCamera(
        50, container.clientWidth / container.clientHeight, 0.1, 5000
      );
      camera.position.set(0, 0, 260);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const sun = new THREE.DirectionalLight(0xffffff, 1.0);
      sun.position.set(5, 3, 5);
      scene.add(sun);

      const geometry = buildGrid();
      const texture = new THREE.TextureLoader().load(EARTH_TEXTURE_URL);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const material = new THREE.MeshPhongMaterial({ map: texture, shininess: 5 });

      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // TrackballControls instead of OrbitControls: OrbitControls always
      // orbits around a fixed world "up" axis, which is what made the
      // globe feel locked/gimbal-jammed near the poles. TrackballControls
      // rotates the camera about whatever arbitrary axis the drag implies,
      // so the globe can be spun freely in any direction, poles included.
      controls = new THREE.TrackballControls(camera, renderer.domElement);
      controls.noZoom = false;
      controls.noPan = false;
      controls.noRotate = false;
      // Slightly less sensitive than before across the board.
      controls.rotateSpeed = 1.9;
      controls.zoomSpeed = 3.4;
      controls.panSpeed = 1.2;
      controls.dynamicDampingFactor = 0.12;
      controls.minDistance = 105;
      controls.maxDistance = 900;

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      const container = document.getElementById('view-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      controls.handleResize();

      // Keep the flat map filling the screen if the window is resized
      // while it's unfolded.
      if (!isGlobe && !isAnimating) {
        camera.position.z = getFlatFitDistance();
        camera.lookAt(0, 0, 0);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isGlobe && autoRotateEnabled) {
        mesh.rotation.y += AUTO_ROTATE_SPEED;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    // Rewrites the mesh's position buffer as a per-vertex lerp between
    // the flat-map positions and the sphere positions, driven by t (0..1).
    function applyMorph(t) {
      const posAttr = mesh.geometry.attributes.position;
      const arr = posAttr.array;
      for (let i = 0; i < arr.length; i++) {
        arr[i] = flatPositions[i] + (spherePositions[i] - flatPositions[i]) * t;
      }
      posAttr.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
    }

    function toggleView() {
      if (isAnimating) return;
      isAnimating = true;

      const btn = document.getElementById('toggle-btn');
      const modeText = document.getElementById('mode-text');
      btn.disabled = true;
      autoRotateEnabled = false;

      if (isGlobe) {
        // Sphere -> flat map: pull the camera back first, then morph,
        // then settle into a top-down framing that fills the screen.
        const fitDistance = getFlatFitDistance();
        mesh.rotation.y = 0; // reset spin so the map isn't rotated when flat

        gsap.timeline({
          onComplete: () => {
            controls.noRotate = true;
            controls.minDistance = 60;
            controls.maxDistance = 1200;
            btn.innerText = 'Switch to Planet Mode';
            modeText.innerText = 'Mapamundi (2D)';
            btn.disabled = false;
            isGlobe = false;
            isAnimating = false;
          }
        })
        .to(camera.position, { x: 0, y: 0, z: fitDistance * 1.3, duration: 0.6, ease: 'power2.inOut',
            onUpdate: () => camera.lookAt(0, 0, 0) })
        .to(morphState, {
            t: 0, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => applyMorph(morphState.t)
          }, '-=0.15')
        .to(camera.position, { x: 0, y: 0, z: fitDistance, duration: 0.5, ease: 'power2.out',
            onUpdate: () => camera.lookAt(0, 0, 0) }, '-=0.1');

      } else {
        // Flat map -> sphere: morph back, then let free rotation resume.
        controls.noRotate = false;
        controls.minDistance = 105;
        controls.maxDistance = 900;

        gsap.timeline({
          onComplete: () => {
            autoRotateEnabled = true;
            btn.innerText = 'Switch to Mapamundi Mode';
            modeText.innerText = 'Planet (3D)';
            btn.disabled = false;
            isGlobe = true;
            isAnimating = false;
          }
        })
        .to(camera.position, { x: 0, y: 0, z: 320, duration: 0.5, ease: 'power2.inOut',
            onUpdate: () => camera.lookAt(0, 0, 0) })
        .to(morphState, {
            t: 1, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => applyMorph(morphState.t)
          }, '-=0.1')
        .to(camera.position, { x: 0, y: 0, z: 260, duration: 0.6, ease: 'power2.out',
            onUpdate: () => camera.lookAt(0, 0, 0) }, '-=0.2');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      morphState.t = 1; // start fully spherical, matches "Planet (3D)" default
      init();
    });
  </script>

</body>
</html>
