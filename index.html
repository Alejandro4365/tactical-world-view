<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Tactical World View</title>

  <!-- =====================================================
       LEAFLET
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- =====================================================
       THREE.JS
  ====================================================== -->

  <script
    src="https://unpkg.com/three@0.154.0/build/three.min.js">
  </script>

  <!-- =====================================================
       GLOBE.GL
  ====================================================== -->

  <script
    src="https://unpkg.com/globe.gl@2.32.0">
  </script>

  <!-- =====================================================
       GSAP
  ====================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js">
  </script>

  <style>


    /* =====================================================
       GLOBAL
    ====================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      background:
        #020611;

      color:
        white;

    }


    /* =====================================================
       MAIN VIEW
    ====================================================== */

    #view-container {

      position:
        relative;

      width:
        100vw;

      height:
        100vh;

      overflow:
        hidden;

    }


    /* =====================================================
       GLOBE + MAP
    ====================================================== */

    #globe-view,
    #map-view {

      position:
        absolute;

      top:
        0;

      left:
        0;

      width:
        100%;

      height:
        100%;

      transform-origin:
        center center;

      will-change:
        transform,
        opacity;

    }


    #globe-view {

      z-index:
        2;

      opacity:
        1;

      pointer-events:
        auto;

    }


    #map-view {

      z-index:
        1;

      opacity:
        0;

      pointer-events:
        none;

      background:
        #020611;

    }


    /* =====================================================
       LEAFLET
    ====================================================== */

    .leaflet-container {

      background:
        #020611;

    }


    /* Remove default Leaflet visual elements */

    .leaflet-control-attribution {

      display:
        none;

    }


    /* =====================================================
       UI
    ====================================================== */

    #ui-container {

      position:
        absolute;

      top:
        20px;

      left:
        20px;

      z-index:
        10000;

      background:

        rgba(
          8,
          14,
          28,
          0.88
        );

      padding:

        16px
        22px;

      border-radius:
        10px;

      backdrop-filter:
        blur(8px);

      border:

        1px solid

        rgba(
          0,
          225,
          255,
          0.3
        );

      box-shadow:

        0
        0
        15px

        rgba(
          0,
          225,
          255,
          0.15
        );

    }


    h2 {

      font-size:
        16px;

      letter-spacing:
        1px;

      text-transform:
        uppercase;

      color:
        #00e1ff;

      margin-bottom:
        6px;

      text-shadow:

        0
        0
        8px

        rgba(
          0,
          225,
          255,
          0.5
        );

    }


    #mode-description {

      font-size:
        12px;

      margin-bottom:
        10px;

      color:
        #8a9bb8;

    }


    #mode-text {

      color:
        white;

    }


    .btn-toggle {

      background:

        linear-gradient(
          135deg,
          #0052d4,
          #4364f7
        );

      color:
        white;

      border:
        none;

      padding:

        10px
        16px;

      font-size:
        13px;

      font-weight:
        bold;

      border-radius:
        6px;

      cursor:
        pointer;

      transition:

        transform
        0.15s
        ease,

        box-shadow
        0.15s
        ease;

      box-shadow:

        0
        4px
        10px

        rgba(
          0,
          0,
          0,
          0.4
        );

    }


    .btn-toggle:hover {

      box-shadow:

        0
        0
        14px

        rgba(
          0,
          225,
          255,
          0.9
        );

      transform:
        translateY(-1px);

    }


    .btn-toggle:active {

      transform:
        scale(0.97);

    }


  </style>

</head>

<body>

  <!-- =====================================================
       UI
  ====================================================== -->

  <div id="ui-container">

```
<h2>
  Tactical Command
</h2>


<p id="mode-description">

  Mode:

  <span id="mode-text">

    Planet (3D)

  </span>

</p>


<button
  class="btn-toggle"
  id="toggle-btn"
>

  Switch to Mapamundi

</button>
```

  </div>

  <!-- =====================================================
       MAP + GLOBE
  ====================================================== -->

  <div id="view-container">

```
<div id="globe-view"></div>

<div id="map-view"></div>
```

  </div>

  <script>


    /* =====================================================
       CONFIGURATION
    ====================================================== */


    /*
      IMPORTANT:

      This exact same texture is used by BOTH:

      1. Globe.gl
      2. Leaflet Mapamundi

      Therefore the land/ocean imagery is identical.
    */

    const EARTH_TEXTURE =
      "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg";


    /*
      The standard equirectangular Earth image covers:

      longitude:
      -180° to +180°

      latitude:
      -90° to +90°
    */

    const EARTH_BOUNDS = [

      [-90, -180],

      [90, 180]

    ];



    /* =====================================================
       GLOBAL STATE
    ====================================================== */

    let isGlobe = true;

    let isAnimating = false;

    let globeInstance = null;

    let mapInstance = null;



    /* =====================================================
       INITIALIZE 3D GLOBE
    ====================================================== */

    function initGlobe() {


      const container =

        document.getElementById(
          "globe-view"
        );


      globeInstance =

        Globe()(container)

          /*
            EXACT SAME IMAGE
            AS MAPAMUNDI
          */

          .globeImageUrl(
            EARTH_TEXTURE
          )


          .bumpImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-topology.png"
          )


          .backgroundImageUrl(
            "https://unpkg.com/three-globe/example/img/night-sky.png"
          )


          .showAtmosphere(
            true
          )


          .atmosphereColor(
            "#00e1ff"
          )


          .atmosphereDayScale(
            0.18
          );



      const controls =

        globeInstance.controls();



      /* =================================================
         AUTO ROTATION
      ================================================= */

      controls.autoRotate = true;

      controls.autoRotateSpeed = 0.8;



      /* =================================================
         RESPONSIVE CONTROLS
      ================================================= */

      controls.zoomSpeed = 4.5;

      controls.rotateSpeed = 2.5;



      /*
        Disable damping.

        This gives immediate response when:

        - rotating
        - zooming
        - stopping movement
      */

      controls.enableDamping = false;


    }



    /* =====================================================
       INITIALIZE MAPAMUNDI
    ====================================================== */

    function initMap() {


      mapInstance =

        L.map(

          "map-view",

          {

            /*
              Simple equirectangular projection.

              This is important because the texture
              itself is equirectangular.
            */

            crs:
              L.CRS.Simple,


            center:

              [

                0,

                0

              ],


            zoom:

              1,


            minZoom:

              -2,


            maxZoom:

              4,


            zoomSnap:

              0.1,


            /*
              Fast zoom.
            */

            zoomDelta:

              0.8,


            /*
              Lower = more responsive.
            */

            wheelPxPerZoomLevel:

              20,


            wheelDebounceTime:

              10,


            scrollWheelZoom:

              true,


            zoomAnimation:

              true,

            zoomControl:

              false,

            attributionControl:

              false

          }

        );



      /*
        DISPLAY THE EXACT SAME TEXTURE
        USED ON THE 3D GLOBE.
      */

      L.imageOverlay(

        EARTH_TEXTURE,

        EARTH_BOUNDS,

        {

          interactive:
            false

        }

      )

      .addTo(
        mapInstance
      );



      /*
        Fit map exactly to Earth texture.
      */

      mapInstance.fitBounds(
        EARTH_BOUNDS,

        {

          animate:
            false

        }

      );


    }



    /* =====================================================
       PLANET -> MAPAMUNDI
    ====================================================== */

    function switchToMap() {


      const globeEl =

        document.getElementById(
          "globe-view"
        );


      const mapEl =

        document.getElementById(
          "map-view"
        );


      const button =

        document.getElementById(
          "toggle-btn"
        );


      const modeText =

        document.getElementById(
          "mode-text"
        );



      /*
        Initialize map once.
      */

      if (
        !mapInstance
      ) {

        initMap();

      }



      /*
        Ensure Leaflet has correct dimensions.
      */

      mapInstance.invalidateSize(
        true
      );


      mapInstance.fitBounds(
        EARTH_BOUNDS,

        {

          animate:
            false

        }

      );



      /*
        Put map above globe.
      */

      mapEl.style.zIndex =
        2;

      globeEl.style.zIndex =
        1;


      mapEl.style.pointerEvents =
        "auto";



      /*
        Starting state of map.
      */

      gsap.set(

        mapEl,

        {

          opacity:
            0,

          scale:
            1.04

        }

      );


      gsap.set(

        globeEl,

        {

          opacity:
            1,

          scale:
            1,

          scaleX:
            1,

          scaleY:
            1

        }

      );



      const timeline =

        gsap.timeline(

          {

            onComplete: () => {


              globeEl.style.pointerEvents =
                "none";


              /*
                Keep map active.
              */

              mapEl.style.pointerEvents =
                "auto";


              button.innerText =
                "Switch to Planet";


              modeText.innerText =
                "Mapamundi (2D)";


              isGlobe =
                false;


              isAnimating =
                false;


            }

          }

        );



      /*
        Globe visually expands
        and flattens.
      */

      timeline.to(

        globeEl,

        {

          opacity:
            0,

          scale:
            1.15,

          scaleX:
            1.3,

          scaleY:
            0.82,

          duration:
            0.65,

          ease:
            "power3.inOut"

        },

        0

      );



      /*
        Same texture appears
        as a flat world.
      */

      timeline.to(

        mapEl,

        {

          opacity:
            1,

          scale:
            1,

          duration:
            0.65,

          ease:
            "power3.out"

        },

        0.1

      );


    }



    /* =====================================================
       MAPAMUNDI -> PLANET
    ====================================================== */

    function switchToGlobe() {


      const globeEl =

        document.getElementById(
          "globe-view"
        );


      const mapEl =

        document.getElementById(
          "map-view"
        );


      const button =

        document.getElementById(
          "toggle-btn"
        );


      const modeText =

        document.getElementById(
          "mode-text"
        );



      /*
        Globe goes above map.
      */

      globeEl.style.zIndex =
        2;

      mapEl.style.zIndex =
        1;


      globeEl.style.pointerEvents =
        "auto";


      mapEl.style.pointerEvents =
        "auto";



      /*
        Globe starts
        visually flattened.
      */

      gsap.set(

        globeEl,

        {

          opacity:
            0,

          scale:
            1.15,

          scaleX:
            1.3,

          scaleY:
            0.82

        }

      );



      const timeline =

        gsap.timeline(

          {

            onComplete: () => {


              mapEl.style.pointerEvents =
                "none";


              globeEl.style.pointerEvents =
                "auto";


              button.innerText =
                "Switch to Mapamundi";


              modeText.innerText =
                "Planet (3D)";


              isGlobe =
                true;


              isAnimating =
                false;


            }

          }

        );



      /*
        Map fades away.
      */

      timeline.to(

        mapEl,

        {

          opacity:
            0,

          scale:
            1.06,

          duration:
            0.5,

          ease:
            "power2.inOut"

        },

        0

      );



      /*
        Globe reforms.
      */

      timeline.to(

        globeEl,

        {

          opacity:
            1,

          scale:
            1,

          scaleX:
            1,

          scaleY:
            1,

          duration:
            0.7,

          ease:
            "power3.out"

        },

        0.08

      );


    }



    /* =====================================================
       MAIN TOGGLE
    ====================================================== */

    function toggleView() {


      if (
        isAnimating
      ) {

        return;

      }


      isAnimating =
        true;



      if (
        isGlobe
      ) {

        switchToMap();

      }

      else {

        switchToGlobe();

      }


    }



    /* =====================================================
       BUTTON
    ====================================================== */

    document
      .getElementById(
        "toggle-btn"
      )
      .addEventListener(

        "click",

        toggleView

      );



    /* =====================================================
       START
    ====================================================== */

    window.addEventListener(

      "DOMContentLoaded",

      () => {


        initGlobe();


      }

    );



    /* =====================================================
       RESIZE
    ====================================================== */

    window.addEventListener(

      "resize",

      () => {


        if (
          mapInstance
        ) {

          mapInstance.invalidateSize(
            true
          );

        }


      }

    );


  </script>

</body>
</html>
