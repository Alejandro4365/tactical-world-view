<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical World View</title>
  
  <!-- Leaflet CSS for 2D Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Globe.gl & Three.js for 3D Earth -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- GSAP for Smooth Transition Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #020611;
      color: #fff;
    }

    #view-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #globe-view, #map-view {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #map-view {
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    #globe-view {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* Videogame UI Controls */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(8, 14, 28, 0.85);
      padding: 16px 22px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.15);
    }

    h2 {
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00e1ff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-toggle:hover {
      box-shadow: 0 0 12px rgba(0, 225, 255, 0.8);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h2>Tactical Command</h2>
    <p style="font-size: 12px; margin-bottom: 10px; color: #8a9bb8;">Mode: <span id="mode-text" style="color: #fff;">Planet (3D)</span></p>
    <button class="btn-toggle" id="toggle-btn" onclick="toggleView()">Switch to Mapamundi</button>
  </div>

  <div id="view-container">
    <div id="globe-view"></div>
    <div id="map-view"></div>
  </div>

  <script>
    let isGlobe = true;
    let isAnimating = false;
    let globeInstance = null;
    let mapInstance = null;

    // Initialize 3D Globe
    function initGlobe() {
      const container = document.getElementById('globe-view');
      
      globeInstance = Globe()
        (container)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .showAtmosphere(true)
        .atmosphereColor('#00e1ff')
        .atmosphereDayScale(0.18);

      const controls = globeInstance.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.8;
      controls.zoomSpeed = 2.5; 
      controls.rotateSpeed = 1.8; 
    }

    // Initialize 2D Map
    function initMap() {
      mapInstance = L.map('map-view', {
        center: [20, 0],
        zoom: 2,
        minZoom: 2,
        zoomSnap: 0.25,
        wheelPxPerZoomLevel: 30
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(mapInstance);
    }

    // Toggle logic with camera animation
    function toggleView() {
      if (isAnimating) return;
      isAnimating = true;

      const globeEl = document.getElementById('globe-view');
      const mapEl = document.getElementById('map-view');
      const btn = document.getElementById('toggle-btn');
      const modeText = document.getElementById('mode-text');

      if (isGlobe) {
        // Zoom out animation on Globe before fading
        const currentAltitude = globeInstance.pointOfView().altitude;
        
        gsap.to(globeInstance.pointOfView(), {
          altitude: currentAltitude * 1.6,
          duration: 0.6,
          ease: "power2.inOut",
          onUpdate: () => globeInstance.pointOfView(globeInstance.pointOfView()),
          onComplete: () => {
            // Show Map View
            globeEl.style.opacity = '0';
            globeEl.style.pointerEvents = 'none';
            mapEl.style.opacity = '1';
            mapEl.style.pointerEvents = 'auto';

            // Lazy initialize map if needed & recalculate sizing
            if (!mapInstance) {
              initMap();
            }
            setTimeout(() => {
              mapInstance.invalidateSize();
            }, 100);

            btn.innerText = 'Switch to Planet Mode';
            modeText.innerText = 'Mapamundi (2D)';
            isGlobe = false;
            isAnimating = false;
          }
        });

      } else {
        // Fade back to Globe
        mapEl.style.opacity = '0';
        mapEl.style.pointerEvents = 'none';
        globeEl.style.opacity = '1';
        globeEl.style.pointerEvents = 'auto';

        // Zoom in animation on Globe arrival
        globeInstance.pointOfView({ altitude: 3 }, 0);

        gsap.to(globeInstance.pointOfView(), {
          altitude: 1.8,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: () => globeInstance.pointOfView(globeInstance.pointOfView()),
          onComplete: () => {
            btn.innerText = 'Switch to Mapamundi Mode';
            modeText.innerText = 'Planet (3D)';
            isGlobe = true;
            isAnimating = false;
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initGlobe();
    });
  </script>

</body>
</html>
