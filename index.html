<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical World View</title>

  <!-- three.js core + TrackballControls (pinned r128 UMD build, mutually compatible) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

  <!-- GSAP for the flat<->sphere morph tween -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #020611;
      color: #fff;
    }

    #view-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #view-container canvas {
      display: block;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(8, 14, 28, 0.85);
      padding: 16px 22px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.15);
      width: 220px;
    }

    h2 {
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00e1ff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .btn-toggle:hover {
      box-shadow: 0 0 12px rgba(0, 225, 255, 0.8);
      transform: translateY(-1px);
    }

    .btn-toggle:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .panel-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 225, 255, 0.2);
    }

    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a9bb8;
      display: block;
      margin-bottom: 6px;
    }

    #skin-select {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      background: #0c1424;
      color: #fff;
      border: 1px solid rgba(0, 225, 255, 0.3);
      font-size: 12px;
    }

    .checkbox-row {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: #dce6f5;
    }

    .checkbox-row input {
      accent-color: #00e1ff;
      cursor: pointer;
    }

    #borders-status {
      font-size: 10px;
      color: #5c7086;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h2>Tactical Command</h2>
    <p style="font-size: 12px; margin-bottom: 10px; color: #8a9bb8;">Mode: <span id="mode-text" style="color: #fff;">Planet (3D)</span></p>
    <button class="btn-toggle" id="toggle-btn" onclick="toggleView()">Switch to Mapamundi</button>

    <div class="panel-section">
      <span class="panel-label">Skin</span>
      <select id="skin-select" onchange="applySkin(this.value)">
        <option value="blueMarble">Blue Marble</option>
        <option value="day">Day Map</option>
        <option value="night">Night Lights</option>
        <option value="topo">Topographic</option>
        <option value="tactical">Tactical Dark</option>
      </select>
    </div>

    <div class="panel-section">
      <label class="checkbox-row">
        <input type="checkbox" id="borders-toggle" disabled onchange="toggleBordersLayer(this.checked)">
        Country Borders
      </label>
      <p id="borders-status">Loading country data&hellip;</p>
    </div>
  </div>

  <div id="view-container"></div>

  <!-- App modules, split by function. Order matters: each file uses
       top-level let/const/function bindings from the ones before it
       (classic scripts on one page share a single global scope). -->
  <script src="js/config.js"></script>
  <script src="js/projection.js"></script>
  <script src="js/state.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/countryLayer.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
