<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical World View</title>
  
  <!-- Leaflet CSS for 2D Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Globe.gl & Three.js for 3D Earth -->
  <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- GSAP for Smooth Transition Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #020611;
      color: #fff;
    }

    #view-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #globe-view, #map-view {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #map-view {
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transform: scale(1.02);
    }

    #globe-view {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
      transform: scale(1);
    }

    /* Videogame UI Controls */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(8, 14, 28, 0.85);
      padding: 16px 22px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.15);
    }

    h2 {
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00e1ff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-toggle:hover {
      box-shadow: 0 0 12px rgba(0, 225, 255, 0.8);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h2>Tactical Command</h2>
    <p style="font-size: 12px; margin-bottom: 10px; color: #8a9bb8;">Mode: <span id="mode-text" style="color: #fff;">Planet (3D)</span></p>
    <button class="btn-toggle" id="toggle-btn" onclick="toggleView()">Switch to Mapamundi</button>
  </div>

  <div id="view-container">
    <div id="globe-view"></div>
    <div id="map-view"></div>
  </div>

  <script>
    let isGlobe = true;
    let isAnimating = false;
    let globeInstance = null;
    let mapInstance = null;


    // ==========================================
    // Initialize 3D Globe
    // ==========================================

    function initGlobe() {

      const container = document.getElementById('globe-view');

      globeInstance = Globe()
        (container)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .showAtmosphere(true)
        .atmosphereColor('#00e1ff')
        .atmosphereDayScale(0.18);


      const controls = globeInstance.controls();

      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.8;

      // Faster zoom
      controls.zoomSpeed = 3.5;

      // Faster rotation
      controls.rotateSpeed = 2.5;

      // Disable damping for immediate response
      controls.enableDamping = false;
    }


    // ==========================================
    // Initialize 2D Map
    // ==========================================

    function initMap() {

      mapInstance = L.map('map-view', {

        center: [20, 0],

        zoom: 2,

        minZoom: 2,

        zoomSnap: 0.25,

        // Faster zooming
        zoomDelta: 1.5,

        // Lower value = faster mouse wheel response
        wheelPxPerZoomLevel: 30,

        // Very low debounce
        wheelDebounceTime: 10,

        scrollWheelZoom: true,

        zoomAnimation: true,

        zoomAnimationThreshold: 8

      });


      L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 19
        }
      ).addTo(mapInstance);
    }


    // ==========================================
    // Toggle Globe / Map
    // ==========================================

    function toggleView() {

      if (isAnimating) return;

      isAnimating = true;


      const globeEl = document.getElementById('globe-view');
      const mapEl = document.getElementById('map-view');

      const btn = document.getElementById('toggle-btn');
      const modeText = document.getElementById('mode-text');


      // ------------------------------------------
      // GLOBE -> MAP
      // ------------------------------------------

      if (isGlobe) {

        // Initialize map before showing it
        if (!mapInstance) {
          initMap();
        }


        // Make sure Leaflet calculates correct dimensions
        mapInstance.invalidateSize();


        // Put map above globe during transition
        mapEl.style.zIndex = 2;
        globeEl.style.zIndex = 1;

        mapEl.style.pointerEvents = 'auto';


        // Animate both views
        gsap.timeline({

          onComplete: () => {

            globeEl.style.pointerEvents = 'none';

            btn.innerText = 'Switch to Planet Mode';

            modeText.innerText = 'Mapamundi (2D)';

            isGlobe = false;

            isAnimating = false;
          }

        })

        .to(
          globeEl,
          {
            opacity: 0,
            scale: 0.98,
            duration: 0.45,
            ease: "power2.inOut"
          },
          0
        )

        .to(
          mapEl,
          {
            opacity: 1,
            scale: 1,
            duration: 0.45,
            ease: "power2.inOut"
          },
          0
        );


      }


      // ------------------------------------------
      // MAP -> GLOBE
      // ------------------------------------------

      else {

        // Put globe above map
        globeEl.style.zIndex = 2;
        mapEl.style.zIndex = 1;

        globeEl.style.pointerEvents = 'auto';


        gsap.timeline({

          onComplete: () => {

            mapEl.style.pointerEvents = 'none';

            btn.innerText = 'Switch to Mapamundi';

            modeText.innerText = 'Planet (3D)';

            isGlobe = true;

            isAnimating = false;
          }

        })

        .to(
          mapEl,
          {
            opacity: 0,
            scale: 1.02,
            duration: 0.45,
            ease: "power2.inOut"
          },
          0
        )

        .to(
          globeEl,
          {
            opacity: 1,
            scale: 1,
            duration: 0.45,
            ease: "power2.inOut"
          },
          0
        );
      }
    }


    // ==========================================
    // Start
    // ==========================================

    window.addEventListener('DOMContentLoaded', () => {

      initGlobe();

    });
  </script>

</body>
</html>
