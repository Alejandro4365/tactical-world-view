<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical World View</title>

  <!-- three.js core + TrackballControls (pinned r128 UMD build, mutually compatible) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TrackballControls.js"></script>

  <!-- earcut for triangulating country polygons (fill layer) -->
  <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>

  <!-- GSAP for the flat<->sphere morph tween -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #020611;
      color: #fff;
    }

    #view-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #view-container canvas {
      display: block;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(8, 14, 28, 0.85);
      padding: 16px 22px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.15);
      width: 220px;
    }

    h2 {
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00e1ff;
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
    }

    .btn-toggle {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .btn-toggle:hover {
      box-shadow: 0 0 12px rgba(0, 225, 255, 0.8);
      transform: translateY(-1px);
    }

    .btn-toggle:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .panel-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 225, 255, 0.2);
    }

    .panel-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a9bb8;
      display: block;
      margin-bottom: 6px;
    }

    #skin-select {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      background: #0c1424;
      color: #fff;
      border: 1px solid rgba(0, 225, 255, 0.3);
      font-size: 12px;
    }

    .checkbox-row {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: #dce6f5;
    }

    .checkbox-row input {
      accent-color: #00e1ff;
      cursor: pointer;
    }

    #borders-status {
      font-size: 10px;
      color: #5c7086;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <h2>Tactical Command</h2>
    <p style="font-size: 12px; margin-bottom: 10px; color: #8a9bb8;">Mode: <span id="mode-text" style="color: #fff;">Planet (3D)</span></p>
    <button class="btn-toggle" id="toggle-btn" onclick="toggleView()">Switch to Mapamundi</button>

    <div class="panel-section">
      <span class="panel-label">Skin</span>
      <select id="skin-select" onchange="applySkin(this.value)">
        <option value="blueMarble">Blue Marble</option>
        <option value="day">Day Map</option>
        <option value="night">Night Lights</option>
        <option value="topo">Topographic</option>
        <option value="tactical">Tactical Dark</option>
      </select>
    </div>

    <div class="panel-section">
      <label class="checkbox-row">
        <input type="checkbox" id="borders-toggle" disabled onchange="toggleBordersLayer(this.checked)">
        Country Borders
      </label>
      <p id="borders-status">Loading country data&hellip;</p>
    </div>
  </div>

  <div id="view-container"></div>

  <script>
    // ---------------------------------------------------------------
    // Mesh configuration
    // ---------------------------------------------------------------
    // High-resolution lat/lon grid shared by BOTH the flat map and the
    // globe. Every vertex is computed twice, mathematically:
    //   - once as a point on the flat map plane (Equal Earth projection)
    //   - once as a point on a sphere, via standard spherical->cartesian
    //     conversion (the same formula THREE.SphereGeometry itself uses)
    // Toggling just interpolates each vertex between its two positions.
    // The country borders/fills/labels layer re-uses the exact same
    // projection helper so it always lines up with the terrain.
    const LON_SEGMENTS = 256; // columns (very high resolution mesh)
    const LAT_SEGMENTS = 128; // rows
    const SPHERE_RADIUS = 100;
    const FLAT_WIDTH = 340;   // world units for the flat map's bounding box
    const FLAT_HEIGHT = 170;

    const EARTH_TEXTURE_URL = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
    const COUNTRIES_GEOJSON_URL = 'https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson';

    // Available globe/map skins.
    const SKINS = {
      blueMarble: { label: 'Blue Marble', url: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg' },
      day:        { label: 'Day Map',      url: 'https://unpkg.com/three-globe/example/img/earth-day.jpg' },
      night:      { label: 'Night Lights', url: 'https://unpkg.com/three-globe/example/img/earth-night.jpg' },
      topo:       { label: 'Topographic',  url: 'https://unpkg.com/three-globe/example/img/earth-topology.png' },
      tactical:   { label: 'Tactical Dark', url: null, color: 0x081226 }
    };

    // --- Equal Earth projection (Savric, Patterson & Jenny, 2018) ---
    const EE_A1 = 1.340264, EE_A2 = -0.081106, EE_A3 = 0.000893, EE_A4 = 0.003796;
    function equalEarthProject(lonDeg, latDeg) {
      const lambda = lonDeg * Math.PI / 180;
      const phi = latDeg * Math.PI / 180;
      const theta = Math.asin((Math.sqrt(3) / 2) * Math.sin(phi));
      const t2 = theta * theta;
      const t3 = t2 * theta;
      const t6 = t3 * t3;
      const t7 = t6 * theta;
      const t8 = t7 * theta;
      const t9 = t8 * theta;
      const x = (2 * Math.sqrt(3) * lambda * Math.cos(theta)) /
                (3 * (9 * EE_A4 * t8 + 7 * EE_A3 * t6 + 3 * EE_A2 * t2 + EE_A1));
      const y = EE_A4 * t9 + EE_A3 * t7 + EE_A2 * t3 + EE_A1 * theta;
      return { x, y };
    }
    const EE_X_MAX = equalEarthProject(180, 0).x;
    const EE_Y_MAX = equalEarthProject(0, 90).y;

    // Shared projection helper: given a lon/lat, return both the flat
    // map position (Equal Earth, z=0) and the sphere position (standard
    // spherical->cartesian). sphereRadius lets overlay layers sit
    // slightly above the base terrain to avoid z-fighting.
    function projectLonLat(lonDeg, latDeg, sphereRadius) {
      const r = sphereRadius === undefined ? SPHERE_RADIUS : sphereRadius;
      const proj = equalEarthProject(lonDeg, latDeg);
      const fx = (proj.x / EE_X_MAX) * (FLAT_WIDTH / 2);
      const fy = (proj.y / EE_Y_MAX) * (FLAT_HEIGHT / 2);
      const phi = (90 - latDeg) * Math.PI / 180;   // colatitude
      const theta = (lonDeg + 180) * Math.PI / 180; // azimuth
      const sx = -r * Math.sin(phi) * Math.cos(theta);
      const sy = r * Math.cos(phi);
      const sz = r * Math.sin(phi) * Math.sin(theta);
      return { flat: { x: fx, y: fy, z: 0 }, sphere: { x: sx, y: sy, z: sz } };
    }

    function normalizeAngle(angle) {
      const twoPi = Math.PI * 2;
      let a = angle % twoPi;
      if (a > Math.PI) a -= twoPi;
      if (a < -Math.PI) a += twoPi;
      return a;
    }

    let scene, camera, renderer, controls, mesh;
    let flatPositions, spherePositions; // Float32Array position buffers (base terrain)
    let countryLayer = null; // THREE.Group holding fills/borders/labels, child of mesh
    let isGlobe = true;
    let isAnimating = false;
    let autoRotateEnabled = true; // slow idle spin of the globe mesh itself
    const AUTO_ROTATE_SPEED = 0.0012; // radians per frame
    const morphState = { t: 0 }; // 0 = fully flat map, 1 = fully sphere

    function buildGrid() {
      const geometry = new THREE.BufferGeometry();

      const vertsPerRow = LON_SEGMENTS + 1;
      const vertsPerCol = LAT_SEGMENTS + 1;
      const vertexCount = vertsPerRow * vertsPerCol;

      flatPositions = new Float32Array(vertexCount * 3);
      spherePositions = new Float32Array(vertexCount * 3);
      const uvs = new Float32Array(vertexCount * 2);

      let vi = 0;
      for (let row = 0; row <= LAT_SEGMENTS; row++) {
        const v = row / LAT_SEGMENTS;
        const lat = 90 - v * 180;

        for (let col = 0; col <= LON_SEGMENTS; col++) {
          const u = col / LON_SEGMENTS;
          const lon = u * 360 - 180;

          const p = projectLonLat(lon, lat, SPHERE_RADIUS);

          flatPositions[vi * 3 + 0] = p.flat.x;
          flatPositions[vi * 3 + 1] = p.flat.y;
          flatPositions[vi * 3 + 2] = p.flat.z;

          spherePositions[vi * 3 + 0] = p.sphere.x;
          spherePositions[vi * 3 + 1] = p.sphere.y;
          spherePositions[vi * 3 + 2] = p.sphere.z;

          // Texture v is flipped here: three.js uploads images with
          // flipY=true by default, so v=1 (not v=0) corresponds to the
          // top/north row of a normally-loaded image.
          uvs[vi * 2 + 0] = u;
          uvs[vi * 2 + 1] = 1 - v;

          vi++;
        }
      }

      const startPositions = new Float32Array(spherePositions);

      const indices = [];
      for (let row = 0; row < LAT_SEGMENTS; row++) {
        for (let col = 0; col < LON_SEGMENTS; col++) {
          const a = row * vertsPerRow + col;
          const b = a + 1;
          const c = a + vertsPerRow;
          const d = c + 1;
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      geometry.setIndex(indices);
      geometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.computeVertexNormals();

      return geometry;
    }

    // Camera distance (looking straight down -z at the origin) needed so
    // the flat map's full FLAT_WIDTH x FLAT_HEIGHT bounding box fits
    // entirely within the current viewport.
    function getFlatFitDistance() {
      const container = document.getElementById('view-container');
      const aspect = container.clientWidth / container.clientHeight;
      const vFov = camera.fov * Math.PI / 180;
      const distForHeight = (FLAT_HEIGHT / 2) / Math.tan(vFov / 2);
      const distForWidth = (FLAT_WIDTH / 2) / (Math.tan(vFov / 2) * aspect);
      return Math.max(distForHeight, distForWidth) * 1.02;
    }

    // =================================================================
    // Skins
    // =================================================================
    function applySkin(key) {
      const skin = SKINS[key];
      if (!skin || !mesh) return;
      if (skin.url) {
        const tex = new THREE.TextureLoader().load(skin.url);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        mesh.material.map = tex;
        mesh.material.color.set(0xffffff);
      } else {
        mesh.material.map = null;
        mesh.material.color.set(skin.color);
      }
      mesh.material.needsUpdate = true;
    }

    // =================================================================
    // Country borders / fills / names layer
    // =================================================================
    const COUNTRY_FILL_OPACITY = 0.4;
    const COUNTRY_BORDER_COLOR = 0xf2f8ff;
    const SPHERE_FILL_RADIUS = SPHERE_RADIUS * 1.002;
    const SPHERE_BORDER_RADIUS = SPHERE_RADIUS * 1.004;
    const SPHERE_LABEL_RADIUS = SPHERE_RADIUS * 1.01;
    const FLAT_FILL_Z = 0.5;
    const FLAT_BORDER_Z = 0.9;
    const FLAT_LABEL_Z = 1.4;

    function hashColorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      }
      const color = new THREE.Color();
      color.setHSL((hash % 360) / 360, 0.5, 0.52);
      return color;
    }

    function makeLabelSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fontSize = 32;
      ctx.font = fontSize + 'px Segoe UI, sans-serif';
      const textWidth = Math.ceil(ctx.measureText(text).width);
      canvas.width = textWidth + 20;
      canvas.height = fontSize + 14;
      ctx.font = fontSize + 'px Segoe UI, sans-serif';
      ctx.fillStyle = 'rgba(2, 6, 17, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#eaf6ff';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 10, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
      const sprite = new THREE.Sprite(material);
      const scale = 0.085;
      sprite.scale.set(canvas.width * scale, canvas.height * scale, 1);
      return sprite;
    }

    function buildCountryLayer(geojson) {
      const fillFlatPositions = [];
      const fillSpherePositions = [];
      const fillColors = [];
      const fillIndices = [];
      const borderFlatPositions = [];
      const borderSpherePositions = [];
      const labelData = [];

      let vertexOffset = 0;

      geojson.features.forEach((feature) => {
        const props = feature.properties || {};
        const name = props.name || props.ADMIN || props.admin || 'Unknown';
        const geom = feature.geometry;
        if (!geom) return;
        const polygons = geom.type === 'Polygon' ? [geom.coordinates]
                        : geom.type === 'MultiPolygon' ? geom.coordinates
                        : null;
        if (!polygons) return;

        const color = hashColorForName(name);
        let largestRingLen = -1;
        let largestRingCentroid = null;

        polygons.forEach((rings) => {
          // --- Fill: triangulate outer + hole rings with earcut ---
          const flat2D = [];
          const holeIndices = [];
          rings.forEach((ring, ringIdx) => {
            if (ringIdx > 0) holeIndices.push(flat2D.length / 2);
            ring.forEach((pt) => { flat2D.push(pt[0], pt[1]); });
          });

          if (flat2D.length >= 6) {
            const triangleIndices = earcut(flat2D, holeIndices.length ? holeIndices : undefined);
            const localVertexCount = flat2D.length / 2;
            for (let i = 0; i < localVertexCount; i++) {
              const lon = flat2D[i * 2];
              const lat = flat2D[i * 2 + 1];
              const p = projectLonLat(lon, lat, SPHERE_FILL_RADIUS);
              fillFlatPositions.push(p.flat.x, p.flat.y, FLAT_FILL_Z);
              fillSpherePositions.push(p.sphere.x, p.sphere.y, p.sphere.z);
              fillColors.push(color.r, color.g, color.b);
            }
            for (let i = 0; i < triangleIndices.length; i++) {
              fillIndices.push(vertexOffset + triangleIndices[i]);
            }
            vertexOffset += localVertexCount;
          }

          // --- Border: every ring as a closed line loop ---
          rings.forEach((ring) => {
            for (let i = 0; i < ring.length; i++) {
              const p1src = ring[i];
              const p2src = ring[(i + 1) % ring.length];
              const p1 = projectLonLat(p1src[0], p1src[1], SPHERE_BORDER_RADIUS);
              const p2 = projectLonLat(p2src[0], p2src[1], SPHERE_BORDER_RADIUS);
              borderFlatPositions.push(p1.flat.x, p1.flat.y, FLAT_BORDER_Z, p2.flat.x, p2.flat.y, FLAT_BORDER_Z);
              borderSpherePositions.push(p1.sphere.x, p1.sphere.y, p1.sphere.z, p2.sphere.x, p2.sphere.y, p2.sphere.z);
            }
          });

          // Track a simple planar-average centroid of the largest ring
          // (outer boundary) for label placement.
          const outer = rings[0];
          if (outer && outer.length > largestRingLen) {
            largestRingLen = outer.length;
            let sLon = 0, sLat = 0;
            outer.forEach((pt) => { sLon += pt[0]; sLat += pt[1]; });
            largestRingCentroid = [sLon / outer.length, sLat / outer.length];
          }
        });

        if (largestRingCentroid) {
          const cProj = projectLonLat(largestRingCentroid[0], largestRingCentroid[1], SPHERE_LABEL_RADIUS);
          cProj.flat.z = FLAT_LABEL_Z;
          labelData.push({ name, flat: cProj.flat, sphere: cProj.sphere });
        }
      });

      const fillGeometry = new THREE.BufferGeometry();
      fillGeometry.setIndex(fillIndices);
      fillGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fillSpherePositions), 3));
      fillGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(fillColors), 3));
      const fillMaterial = new THREE.MeshBasicMaterial({
        vertexColors: true, transparent: true, opacity: COUNTRY_FILL_OPACITY,
        side: THREE.DoubleSide, depthWrite: false
      });
      const fillMesh = new THREE.Mesh(fillGeometry, fillMaterial);
      fillMesh.userData.flatPositions = new Float32Array(fillFlatPositions);
      fillMesh.userData.spherePositions = new Float32Array(fillSpherePositions);

      const borderGeometry = new THREE.BufferGeometry();
      borderGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(borderSpherePositions), 3));
      const borderMaterial = new THREE.LineBasicMaterial({ color: COUNTRY_BORDER_COLOR, transparent: true, opacity: 0.85 });
      const borderLines = new THREE.LineSegments(borderGeometry, borderMaterial);
      borderLines.userData.flatPositions = new Float32Array(borderFlatPositions);
      borderLines.userData.spherePositions = new Float32Array(borderSpherePositions);

      const labelGroup = new THREE.Group();
      labelData.forEach(({ name, flat, sphere }) => {
        const sprite = makeLabelSprite(name);
        sprite.position.set(sphere.x, sphere.y, sphere.z);
        sprite.userData.flatPos = flat;
        sprite.userData.spherePos = sphere;
        labelGroup.add(sprite);
      });

      countryLayer = new THREE.Group();
      countryLayer.userData.fillMesh = fillMesh;
      countryLayer.userData.borderLines = borderLines;
      countryLayer.userData.labelGroup = labelGroup;
      countryLayer.add(fillMesh, borderLines, labelGroup);
      countryLayer.visible = document.getElementById('borders-toggle').checked;

      mesh.add(countryLayer); // inherits mesh's own rotation (auto-spin) automatically
      applyCountryMorph(morphState.t);
    }

    function lerpBufferPositions(attr, flatArr, sphereArr, t) {
      const arr = attr.array;
      for (let i = 0; i < arr.length; i++) {
        arr[i] = flatArr[i] + (sphereArr[i] - flatArr[i]) * t;
      }
      attr.needsUpdate = true;
    }

    function applyCountryMorph(t) {
      if (!countryLayer) return;
      const fillMesh = countryLayer.userData.fillMesh;
      const borderLines = countryLayer.userData.borderLines;
      const labelGroup = countryLayer.userData.labelGroup;

      lerpBufferPositions(fillMesh.geometry.attributes.position, fillMesh.userData.flatPositions, fillMesh.userData.spherePositions, t);
      lerpBufferPositions(borderLines.geometry.attributes.position, borderLines.userData.flatPositions, borderLines.userData.spherePositions, t);

      labelGroup.children.forEach((sprite) => {
        const f = sprite.userData.flatPos, s = sprite.userData.spherePos;
        sprite.position.set(
          f.x + (s.x - f.x) * t,
          f.y + (s.y - f.y) * t,
          f.z + (s.z - f.z) * t
        );
      });
    }

    function toggleBordersLayer(checked) {
      if (countryLayer) countryLayer.visible = checked;
    }

    async function loadCountries() {
      const statusEl = document.getElementById('borders-status');
      try {
        const res = await fetch(COUNTRIES_GEOJSON_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const geojson = await res.json();
        buildCountryLayer(geojson);
        document.getElementById('borders-toggle').disabled = false;
        if (statusEl) statusEl.textContent = geojson.features.length + ' countries loaded';
      } catch (err) {
        console.error('Failed to load country border data:', err);
        if (statusEl) statusEl.textContent = 'Border data unavailable';
      }
    }

    // =================================================================
    // Core scene
    // =================================================================
    function init() {
      const container = document.getElementById('view-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020611);

      camera = new THREE.PerspectiveCamera(
        50, container.clientWidth / container.clientHeight, 0.1, 5000
      );
      camera.position.set(0, 0, 260);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const sun = new THREE.DirectionalLight(0xffffff, 1.0);
      sun.position.set(5, 3, 5);
      scene.add(sun);

      const geometry = buildGrid();
      const texture = new THREE.TextureLoader().load(EARTH_TEXTURE_URL);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const material = new THREE.MeshPhongMaterial({ map: texture, shininess: 5 });

      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // TrackballControls instead of OrbitControls: OrbitControls always
      // orbits around a fixed world "up" axis, which is what made the
      // globe feel locked/gimbal-jammed near the poles. TrackballControls
      // rotates the camera about whatever arbitrary axis the drag implies,
      // so the globe can be spun freely in any direction, poles included.
      controls = new THREE.TrackballControls(camera, renderer.domElement);
      controls.noZoom = false;
      controls.noPan = false;
      controls.noRotate = false;
      controls.rotateSpeed = 1.9;
      controls.zoomSpeed = 3.4;
      controls.panSpeed = 1.2;
      controls.dynamicDampingFactor = 0.12;
      controls.minDistance = 105;
      controls.maxDistance = 900;

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      const container = document.getElementById('view-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      controls.handleResize();

      if (!isGlobe && !isAnimating) {
        camera.position.z = getFlatFitDistance();
        camera.lookAt(0, 0, 0);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isGlobe && autoRotateEnabled) {
        mesh.rotation.y += AUTO_ROTATE_SPEED;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    // Rewrites the mesh's position buffer as a per-vertex lerp between
    // the flat-map positions and the sphere positions, driven by t (0..1).
    function applyMorph(t) {
      const posAttr = mesh.geometry.attributes.position;
      const arr = posAttr.array;
      for (let i = 0; i < arr.length; i++) {
        arr[i] = flatPositions[i] + (spherePositions[i] - flatPositions[i]) * t;
      }
      posAttr.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
      applyCountryMorph(t);
    }

    function toggleView() {
      if (isAnimating) return;
      isAnimating = true;

      const btn = document.getElementById('toggle-btn');
      const modeText = document.getElementById('mode-text');
      btn.disabled = true;
      autoRotateEnabled = false;

      if (isGlobe) {
        // Sphere -> flat map: pull the camera back, then rotate the mesh
        // and camera "up" vector back to their canonical (parallel-to-
        // screen) orientation WHILE morphing, then settle into a
        // screen-filling top-down framing.
        const fitDistance = getFlatFitDistance();

        // Normalize the accumulated auto-spin to its equivalent angle in
        // [-PI, PI] so the tween to 0 takes the shortest path instead of
        // unwinding several full turns.
        mesh.rotation.y = normalizeAngle(mesh.rotation.y);
        const upTarget = { x: camera.up.x, y: camera.up.y, z: camera.up.z };

        gsap.timeline({
          onComplete: () => {
            controls.noRotate = true;
            controls.minDistance = 60;
            controls.maxDistance = 1200;
            btn.innerText = 'Switch to Planet Mode';
            modeText.innerText = 'Mapamundi (2D)';
            btn.disabled = false;
            isGlobe = false;
            isAnimating = false;
          }
        })
        .to(camera.position, { x: 0, y: 0, z: fitDistance * 1.3, duration: 0.6, ease: 'power2.inOut',
            onUpdate: () => camera.lookAt(0, 0, 0) })
        .to(morphState, {
            t: 0, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => applyMorph(morphState.t)
          }, '-=0.15')
        .to(mesh.rotation, { y: 0, duration: 0.9, ease: 'power2.inOut' }, '<')
        .to(upTarget, { x: 0, y: 1, z: 0, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => camera.up.set(upTarget.x, upTarget.y, upTarget.z) }, '<')
        .to(camera.position, { x: 0, y: 0, z: fitDistance, duration: 0.5, ease: 'power2.out',
            onUpdate: () => camera.lookAt(0, 0, 0) }, '-=0.1');

      } else {
        // Flat map -> sphere: morph back, then let free rotation resume.
        controls.noRotate = false;
        controls.minDistance = 105;
        controls.maxDistance = 900;
        const upTarget = { x: camera.up.x, y: camera.up.y, z: camera.up.z };

        gsap.timeline({
          onComplete: () => {
            autoRotateEnabled = true;
            btn.innerText = 'Switch to Mapamundi Mode';
            modeText.innerText = 'Planet (3D)';
            btn.disabled = false;
            isGlobe = true;
            isAnimating = false;
          }
        })
        .to(camera.position, { x: 0, y: 0, z: 320, duration: 0.5, ease: 'power2.inOut',
            onUpdate: () => camera.lookAt(0, 0, 0) })
        .to(morphState, {
            t: 1, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => applyMorph(morphState.t)
          }, '-=0.1')
        .to(upTarget, { x: 0, y: 1, z: 0, duration: 0.9, ease: 'power2.inOut',
            onUpdate: () => camera.up.set(upTarget.x, upTarget.y, upTarget.z) }, '<')
        .to(camera.position, { x: 0, y: 0, z: 260, duration: 0.6, ease: 'power2.out',
            onUpdate: () => camera.lookAt(0, 0, 0) }, '-=0.2');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      morphState.t = 1; // start fully spherical, matches "Planet (3D)" default
      init();
      loadCountries();
    });
  </script>

</body>
</html>
